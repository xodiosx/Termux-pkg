name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  sync-upstream:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git and Sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add upstream repository
          git remote add upstream https://github.com/termux/termux-packages.git
          git fetch upstream master

          # Merge upstream into your master branch
          git checkout master
          git merge upstream/master --no-edit -m "Chore: sync with upstream termux-packages" || {
            echo "Merge conflict detected! Resolving by keeping local custom packages..."
            git checkout --ours .
            git add .
            git commit -m "Chore: resolved merge conflicts during upstream sync"
          }

          # Push changes back to your fork
          git push origin master
