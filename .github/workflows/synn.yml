name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch and Merge Upstream
        run: |
          git remote add upstream https://github.com/termux/termux-packages.git
          git fetch upstream master
          git checkout master

          # Attempt merge
          if ! git merge upstream/master --no-edit -m "Chore: sync with upstream termux-packages"; then
            echo "Merge conflict detected! Keeping local custom packages..."
            git checkout --ours .
            git add .
            git commit -m "Chore: resolved merge conflicts during upstream sync"
          fi

          # If PAT_TOKEN is not set, undo upstream workflow file updates so GITHUB_TOKEN push succeeds
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "PAT_TOKEN not detected. Restoring workflow files to bypass GITHUB_TOKEN push restrictions..."
            git checkout HEAD~1 -- .github/workflows/
            git commit -m "Chore: preserve local workflow files" || true
          fi

          git push origin master
